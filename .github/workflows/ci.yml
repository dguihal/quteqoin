name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Linux (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ninja-build qt6-base-dev qt6-multimedia-dev libgl1-mesa-dev

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON

      - name: Build application and tests
        run: cmake --build build --parallel 2

      - name: Run behavior tests
        working-directory: build
        run: ctest --output-on-failure --no-tests=error --timeout 60 --output-junit test-results.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-reports-${{ matrix.build_type }}
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7